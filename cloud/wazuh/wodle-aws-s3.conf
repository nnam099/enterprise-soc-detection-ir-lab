<wodle name="aws-s3">
  <disabled>no</disabled>
  <interval>5m</interval>
  <run_on_start>yes</run_on_start>
  <skip_on_error>yes</skip_on_error>

  <bucket type="cloudtrail">
    <name>soc-hybrid-logs-411109262083</name>
    <aws_profile>wazuh-aws</aws_profile>
  </bucket>

  <bucket type="vpcflow">
    <name>soc-hybrid-logs-411109262083</name>
    <aws_profile>wazuh-aws</aws_profile>
  </bucket>
</wodle>
